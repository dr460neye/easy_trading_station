name: Release

# Manual: Actions -> Release -> Run workflow. Publishes mod_version from gradle.properties of the
# chosen branch as a stable release to GitHub and, always, to CurseForge.
# Prepare first with  python tools/prepare_release.py <version>  and push the result.
# See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal mod_version in gradle.properties (safety check)"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check version, branch and changelog
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_REF_NAME" in
            main|mc/*) ;;
            *) echo "::error::Releases are made from main or mc/<version> branches, not from $GITHUB_REF_NAME"; exit 1 ;;
          esac
          PROP="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if ! echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A release version looks like 1.2.0 (pre-releases are published automatically)"; exit 1
          fi
          if [ "$INPUT_VERSION" != "$PROP" ]; then
            echo "::error::Input says $INPUT_VERSION but gradle.properties has mod_version=$PROP. Run tools/prepare_release.py and push first"; exit 1
          fi
          python3 tools/changelog_section.py "$INPUT_VERSION" > /dev/null

  publish:
    needs: check
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
      curseforge: true
    secrets: inherit
