name: Release

# Release by pushing a tag named  <minecraft version>-<mod version>, for example
#   26.1.2-1.0.0         stable release
#   26.1.2-1.1.0-beta.1  pre-release (beta), -alpha.N and -rc.N work too
# See docs/RELEASING.md.
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*-*"
      - "[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*-[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against gradle.properties
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          MC="${TAG%%-*}"
          VERSION="${TAG#*-}"
          PROP_MC="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          PROP_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          PROP_JAVA="$(grep '^java_version=' gradle.properties | cut -d= -f2)"
          if [ "$MC" != "$PROP_MC" ]; then echo "::error::Tag says Minecraft $MC but gradle.properties has $PROP_MC"; exit 1; fi
          if [ "$VERSION" != "$PROP_VERSION" ]; then echo "::error::Tag says version $VERSION but gradle.properties has $PROP_VERSION"; exit 1; fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::$VERSION is not a valid version (MAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N])"; exit 1
          fi
          case "$VERSION" in
            *-alpha.*) TYPE=alpha; PRE=true ;;
            *-beta.*|*-rc.*) TYPE=beta; PRE=true ;;
            *) TYPE=release; PRE=false ;;
          esac
          {
            echo "tag=$TAG"; echo "mc=$MC"; echo "version=$VERSION"; echo "java=$PROP_JAVA"
            echo "type=$TYPE"; echo "prerelease=$PRE"
            echo "title=Easy Trading Station $VERSION (NeoForge $MC)"
            echo "jar=build/libs/easy-trading-station-neoforge-$MC-$VERSION.jar"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Check jar name
        run: test -f "${{ steps.meta.outputs.jar }}" || (echo "::error::Expected jar not found"; ls build/libs; exit 1)

      - name: Release notes from CHANGELOG.md
        run: python3 tools/changelog_section.py "${{ steps.meta.outputs.version }}" > RELEASE_NOTES.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.jar }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag $FLAGS

      # Needs the secret CURSEFORGE_TOKEN and the repository variable CURSEFORGE_PROJECT_ID.
      # Without them this step is skipped and only the GitHub release is created.
      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: ${{ steps.meta.outputs.jar }}
          name: ${{ steps.meta.outputs.title }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: RELEASE_NOTES.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.mc }}
          java: ${{ steps.meta.outputs.java }}
          dependencies: |
            easy-npc(required){curseforge:easy-npc}
          fail-mode: fail
