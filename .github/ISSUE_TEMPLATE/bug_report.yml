name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Place a station\n2. ..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Mod, Minecraft, NeoForge and Easy NPC version, and the modpack if any
      placeholder: "Easy Trading Station 1.0.0, Minecraft 26.1.2, NeoForge 26.1.2.126, Easy NPC 7.18.0"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: latest.log
      description: Paste lines from `logs/latest.log` that mention `easy_npc_trading_station`, or attach the file
      render: text
