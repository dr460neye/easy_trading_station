modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="dr460neye"
description='''
Catch villagers, wandering traders and (with Easy NPC installed) Easy NPCs with the NPC Catcher and keep them in a glass Trading Station.
The NPC keeps its trades, dialogs and scripts, but stands still and costs no server performance.
Workstations, station upgrades and recipes are configurable. Easy NPC and Easy Villagers are optional.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="easy_npc"
    type="optional"
    versionRange="${easy_npc_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="easy_villagers"
    type="optional"
    ordering="NONE"
    side="BOTH"
